<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, minimum-scale=1.0"/>
<meta name="theme-color" content="#0b0b0b">
<title>Stream Box</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="128x128" href="/logos/icon-192.png">
<link rel="icon" type="image/png" sizes="256x256" href="/logos/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/logos/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/responsive.css?v=4">
<link rel="stylesheet" href="/motion.css">
<script src="/favicon.js?v=2" defer></script>
<script src="/motion.js" defer></script>



<style>
:root{
  --red:#E50914;
  --red-dim:#b0060f;
  --red-glow:rgba(229,9,20,.35);
  --bg:#141414;
  --bg-deep:#0b0b0b;
  --bg-elevated:#1c1c1c;
  --bg-card:#181818;
  --grey:#b3b3b3;
  --grey-dim:#8c8c8c;
  --hairline:rgba(255,255,255,.09);

  /* Unified OTT brand tokens */
  --brand-gap:8px;
  --brand-gap-lg:12px;
  --brand-radius:12px;
  --brand-radius-sm:6px;
  --brand-blur:10px;
  --brand-transition:260ms;
  --brand-ease:cubic-bezier(.22,.9,.24,1);
  --brand-overlay-bg:rgba(0,0,0,0.26);
  --brand-overlay-shadow:0 12px 34px rgba(0,0,0,0.28);
  --brand-text-spacing:0.2px;
  --brand-nav-opacity:0.85;
  --brand-hover-opacity:1;
  --motion-fast:180ms;
  --motion-med:320ms;
  --motion-slow:620ms;
  --motion-cinema:cubic-bezier(.16,1,.3,1);
}


*{margin:0;padding:0;box-sizing:border-box}

html{ scroll-behavior:smooth; }

body{
  background:var(--bg);
  color:#fff;
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

body.nav-open{
  overflow:hidden;
}

::selection{ background:var(--red); color:#fff; }

/* subtle top-to-bottom vignette so sections feel like one cinematic canvas
   rather than flat stacked blocks */
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:radial-gradient(1400px 700px at 50% -8%, rgba(229,9,20,.05), transparent 60%);
}

/* LOADER */
#loading{
  position:fixed;inset:0;
  background:var(--bg-deep);
  display:flex;align-items:center;justify-content:center;
  z-index:9999;
  transition:opacity var(--motion-slow) var(--motion-cinema), transform var(--motion-slow) var(--motion-cinema);
  will-change:opacity, transform;
}
#loading::after{
  content:'';
  width:34px;height:34px;
  border-radius:50%;
  border:2.5px solid rgba(255,255,255,.14);
  border-top-color:var(--red);
  animation:loaderSpin .8s linear infinite;
}
@keyframes loaderSpin{ to{ transform:rotate(360deg); } }
#loading.fade-out{opacity:0;pointer-events:none;transform:scale(1.015)}

/* NAVBAR */
.navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  padding:14px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(to bottom, rgba(0,0,0,.92), rgba(0,0,0,.18) 78%, transparent);
  z-index:1000;
  transition:background var(--motion-med) var(--motion-cinema), transform var(--motion-med) var(--motion-cinema), box-shadow var(--motion-med) var(--motion-cinema);
  will-change:background, transform;
}

.navbar.scrolled{
  background:rgba(10,10,10,.92);
  backdrop-filter:blur(var(--brand-blur));
  -webkit-backdrop-filter:blur(var(--brand-blur));
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  border-bottom:1px solid var(--hairline);
}

.nav-left{
  display:flex;
  align-items:center;
  gap:18px;
}



.logo{
  color:var(--red);
  font-size:1.8rem;
  font-weight:900;
  letter-spacing:-0.02em;
}

.nav-logo{
  height:32px;
  width:auto;
  object-fit:contain;
  display:block;
  image-rendering:auto;
  transform:translateZ(0);
}
@media (max-width: 600px){
  .nav-logo{ height:32px; }
}



.brand-unit{
  display:flex;
  align-items:center;
  gap:var(--brand-gap-lg);
}


.nav-links{
  display:flex;
  align-items:center;
}

.nav-links span{
  position:relative;
  margin-right:22px;
  color:#cfcfcf;
  font-size:.95rem;
  cursor:pointer;
  transition:opacity var(--brand-transition) var(--brand-ease), color var(--brand-transition) var(--brand-ease), transform var(--brand-transition) var(--brand-ease);
  letter-spacing:0.05px;
  opacity:var(--brand-nav-opacity);
}

.nav-links span::after{
  content:'';
  position:absolute;
  left:0; right:0; bottom:-6px;
  height:2px;
  background:var(--red);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform var(--motion-fast) var(--motion-cinema);
}

.nav-links span:hover{
  color:#fff;
  transform:translate3d(0,-1px,0);
}
.nav-links span:hover::after{
  transform:scaleX(1);
}

.menu-btn{
  display:none;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  color:#fff;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  transition:background var(--motion-fast) var(--motion-cinema), transform var(--motion-fast) var(--motion-cinema), opacity var(--motion-fast) var(--motion-cinema);
  will-change:transform;
}

.menu-btn:hover{ background:rgba(255,255,255,.18); }
.menu-btn:active{ transform:scale(.94); }
.menu-btn svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  transition:transform var(--motion-fast) var(--motion-cinema);
}
body.nav-open .menu-btn svg{ transform:rotate(90deg); }

.nav-scrim{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  backdrop-filter:blur(2px);
  opacity:0;
  pointer-events:none;
  transition:opacity var(--motion-med) var(--motion-cinema);
  z-index:950;
}

/* RIGHT NAV */
.nav-right{
  display:flex;
  gap:14px;
  align-items:center;
}

.icon-btn{
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.08);
  border:0;
  border-radius:50%;
  color:#fff;
  cursor:pointer;
  transition:background var(--motion-fast) var(--motion-cinema), transform var(--motion-fast) var(--motion-cinema), opacity var(--motion-fast) var(--motion-cinema);
  will-change:transform;
}
.icon-btn:hover{
  background:rgba(255,255,255,.2);
  transform:translate3d(0,-1px,0) scale(1.035);
}
.icon-btn:active{
  transform:scale(.94);
}
.icon-btn:focus-visible{
  outline:2px solid #fff;
  outline-offset:2px;
}

/* FIXED SVG */
.icon-btn svg{
  width:18px;
  height:18px;
  stroke:#fff;
  fill:none;
  stroke-width:2;
}

/* HERO */
.hero{
  height:89vh;
  min-height:670px;
  position:relative;
  overflow:hidden;
}



.hero video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero::after{
  content:'';
  position:absolute;
  inset:0;
  z-index:1;

  /* Full-width + full-height coverage with bottom fade that doesn’t leave gaps.
     Keep it subtle to preserve poster detail. */
  background:
    radial-gradient(900px 520px at 18% 52%, rgba(0,0,0,0.08), rgba(0,0,0,0.70) 70%),
    linear-gradient(to right, rgba(0,0,0,.78) 0%, rgba(0,0,0,.22) 45%, rgba(0,0,0,.08) 80%),
    linear-gradient(to top, rgba(20,20,20,.75) 0%, rgba(20,20,20,0) 55%),

    /* Bottom overlay: ensure coverage LEFT→RIGHT and bottom area is always masked. */
    linear-gradient(to bottom, rgba(0,0,0,.66) 0%, rgba(0,0,0,.18) 55%, rgba(0,0,0,0) 100%),

    rgba(0,0,0,0.10);

  pointer-events:none;
}

/* extra bottom feather so hero melts into the sections below instead of
   ending on a hard edge */
.hero-fade{
  position:absolute;
  left:0; right:0; bottom:0;
  height:140px;
  background:linear-gradient(to bottom, transparent, var(--bg) 92%);
  z-index:1;
  pointer-events:none;
}


/* Keep hero background images behind the overlay to avoid edge gaps */
.hero-background{
  z-index:0;
}

#heroImgA,
#heroImgB{
  z-index:0;
}

.hero-content{
  z-index:2;
}



/* balance hero composition */
.hero-background img{
  filter: saturate(0.95) contrast(1.05);
}

/* Cinematic hero imgs */
.hero-img{
  transform:scale(1.02);
  will-change:transform, opacity;
  backface-visibility:hidden;
}
.hero-img.active{
  /* motion.js hero sweep/parallax drives the cinematic feel.
     Keep Ken Burns extremely subtle to prevent over-animation. */
  animation:heroKenBurns 22s var(--motion-cinema) infinite;
}

@keyframes heroKenBurns{
  0%{ transform:scale(1.01) translate3d(0,0,0); }
  50%{ transform:scale(1.03) translate3d(-0.4%, -0.25%, 0); }
  100%{ transform:scale(1.01) translate3d(0,0,0); }
}

.hero-content{
  position:absolute;
  top:50%;
  left:60px;
  transform:translateY(-70%);
  max-width:440px;
  z-index:2;
  opacity:0;
  animation:heroContentIn .72s var(--motion-cinema) .12s forwards;
  will-change:opacity, transform;
}

@keyframes heroContentIn{
  from{ opacity:0; transform:translate3d(0,-62%,0); }
  to{ opacity:1; transform:translate3d(0,-70%,0); }
}

.hero-eyebrow{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:var(--red);
  font-weight:700;
  font-size:.82rem;
  margin-bottom:14px;
}
.hero-eyebrow svg{ width:15px; height:15px; fill:var(--red); }

.hero-title{
  font-size:3rem;
  font-weight:900;
  letter-spacing:0;
  line-height:1.05;
  text-shadow:0 12px 42px rgba(0,0,0,.55);
}

.hero-meta{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:14px;
  color:#d5d5d5;
  font-size:.88rem;
}
.hero-meta .dot{
  width:3px;height:3px;border-radius:50%;
  background:var(--grey-dim);
}
.hero-match{
  color:#4ade80;
  font-weight:700;
}

.hero-desc{
  color:#ddd;
  margin:15px 0;
  line-height:1.45;
}

.hero-buttons{
  display:flex;
  gap:12px;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:10px 22px;
  border:none;
  font-weight:600;
  font-size:.98rem;
  cursor:pointer;
  border-radius:4px;
  transition:background var(--motion-fast) var(--motion-cinema), transform var(--motion-fast) var(--motion-cinema), opacity var(--motion-fast) var(--motion-cinema), box-shadow var(--motion-fast) var(--motion-cinema);
  will-change:transform;
}
.btn svg{ width:18px; height:18px; }
.btn:hover{ transform:translate3d(0,-2px,0) scale(1.025); }
.btn:active{ transform:scale(.97); }
.btn:focus-visible{
  outline:2px solid #fff;
  outline-offset:3px;
}

.btn-play{
  background:#fff;
  color:#000;
}
.btn-play svg{ fill:#000; stroke:none; }
.btn-play:hover{background:#e2e2e2;}

.btn-info{
  background:rgba(109,109,110,.55);
  color:#fff;
  backdrop-filter:blur(4px);
}
.btn-info svg{ stroke:#fff; fill:none; }
.btn-info:hover{background:rgba(109,109,110,.8);}

.btn-retry{
  background:transparent;
  color:#fff;
  border:1.5px solid rgba(255,255,255,.5) !important;
}
.btn-retry:hover{ border-color:#fff !important; background:rgba(255,255,255,.08); }

/* SECTIONS */
.section{
  position:relative;
  z-index:1;
  padding:26px 40px;
  content-visibility:auto;
  contain-intrinsic-size:360px;
}

.section-title{
  font-size:1.2rem;
  font-weight:700;
  margin-bottom:10px;
  letter-spacing:.01em;
  padding-left:14px;
  border-left:3px solid var(--red);
  transition:color var(--motion-fast) var(--motion-cinema), transform var(--motion-fast) var(--motion-cinema);
}

/* hide empty rows without placeholders */
.section.is-empty{ display:none; }

/* ROW (Netflix-style carousel) */
.row-wrap{
  position:relative;
}

.row{
  display:flex;
  gap:14px;
  overflow-x:auto;
  overflow-y:visible;
  padding:14px 4px 18px;
  scroll-snap-type:x proximity;
  scroll-behavior:smooth;

  /* Ensure only the page uses a single scrollbar; hide any row/nested scrollbar UI */
  scrollbar-width:none;
  -ms-overflow-style:none;
  overscroll-behavior-inline:contain;
  -webkit-overflow-scrolling:touch;
}
.row::-webkit-scrollbar{width:0;height:0}

/* soft edge fades so the row reads as "more to scroll" rather than a hard cut */
.row-wrap::before,
.row-wrap::after{
  content:'';
  position:absolute;
  top:14px; bottom:18px;
  width:48px;
  z-index:2;
  pointer-events:none;
  opacity:0;
  transition:opacity var(--motion-fast) var(--motion-cinema);
}
.row-wrap::before{
  left:0;
  background:linear-gradient(to right, var(--bg), transparent);
}
.row-wrap::after{
  right:0;
  background:linear-gradient(to left, var(--bg), transparent);
}
.row-wrap:hover::before,
.row-wrap:hover::after{ opacity:1; }

.row-arrow{
  position:absolute;
  top:14px; bottom:18px;
  width:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(20,20,20,.55);
  border:0;
  color:#fff;
  cursor:pointer;
  z-index:3;
  opacity:0;
  transition:opacity var(--motion-fast) var(--motion-cinema), background var(--motion-fast) var(--motion-cinema);
}
.row-wrap:hover .row-arrow{ opacity:1; }
.row-arrow:hover{ background:rgba(20,20,20,.85); }
.row-arrow svg{ width:22px; height:22px; stroke:#fff; fill:none; stroke-width:2.5; }
.row-arrow.prev{ left:0; }
.row-arrow.next{ right:0; }
@media (hover:none){
  .row-arrow{ display:none; }
}

.row > .card{
  scroll-snap-align:start;
}

/* CARD */
.card{
  min-width:180px;
  transition:transform var(--motion-med) var(--motion-cinema), opacity var(--motion-med) var(--motion-cinema);
  cursor:pointer;
  position:relative;
  transform:translateZ(0);
  will-change:transform;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  border-radius:6px;
  box-shadow:0 10px 28px rgba(0,0,0,.28);
  background:linear-gradient(135deg, #1a1a1a, #0e0e0e);
}

/* subtle premium hover */
/* Card hover is primarily driven by public/motion.css for premium layered motion.
   This base rule is softened to avoid double-transform fighting. */
.card:hover{
  transform: translate3d(0,-6px,0) scale(1.02);
  z-index:50;
}

.card img{
  transition: transform var(--motion-slow) var(--motion-cinema), filter var(--motion-med) var(--motion-cinema), box-shadow var(--motion-med) var(--motion-cinema), opacity var(--motion-med) var(--motion-cinema);
  will-change:transform;
}

.card:hover img{
  filter: brightness(1.12) contrast(1.06);
  transform: scale(1.05);
  box-shadow:0 22px 54px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.12);
}

.card p{
  font-size:.85rem;
  margin-top:6px;
  color:#ccc;
  opacity:.86;
  transform:translate3d(0,0,0);
  transition:color var(--motion-fast) var(--motion-cinema), opacity var(--motion-fast) var(--motion-cinema), transform var(--motion-fast) var(--motion-cinema);
}
.card:hover p{
  color:#fff;
  opacity:1;
  transform:translate3d(0,-1px,0);
}

.card:focus-visible,
.card.focused{
  outline:2px solid rgba(255,255,255,.94);
  outline-offset:4px;
  transform:translate3d(0,-10px,0) scale(1.045);
}

/* SEARCH */
#searchOverlay{
  position:fixed;
  inset:0;
  background:rgba(8,8,8,.97);
  backdrop-filter:blur(6px);
  display:none;
  flex-direction:column;
  padding:40px;
  z-index:3000;
  opacity:0;
  transform:translateY(8px);
  transition:opacity var(--motion-med) var(--motion-cinema), transform var(--motion-med) var(--motion-cinema);
  will-change:opacity, transform;
}

#searchOverlay.show {
  opacity:1;
  transform:translateY(0);
}

.search-field{
  position:relative;
  max-width:640px;
  width:100%;
  margin-bottom:24px;
}
.search-field svg{
  position:absolute;
  left:16px; top:50%;
  transform:translateY(-50%);
  width:18px; height:18px;
  stroke:var(--grey-dim);
  fill:none;
  stroke-width:2;
  pointer-events:none;
}

#searchBox{
  width:100%;
  padding:16px 16px 16px 46px;
  font-size:18px;
  background:var(--bg-elevated);
  border:1.5px solid var(--hairline);
  border-radius:var(--brand-radius-sm);
  color:#fff;
  outline:none;
  transition:border-color var(--motion-fast) var(--motion-cinema), background var(--motion-fast) var(--motion-cinema);
}
#searchBox::placeholder{ color:var(--grey-dim); }
#searchBox:focus{
  border-color:var(--red);
  background:#212121;
}

#searchResults{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.close-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  border:0;
  background:transparent;
  padding:0;
  font:inherit;
  margin-bottom:22px;
  cursor:pointer;
  color:#ccc;
  transition:color var(--motion-fast) var(--motion-cinema);
}
.close-btn:hover{color:#fff}
.close-btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; }

/* FOOTER */
.site-footer{
  position:relative;
  z-index:1;
  margin-top:20px;
  padding:44px 40px 36px;
  border-top:1px solid var(--hairline);
  color:var(--grey-dim);
}
.footer-links{
  display:grid;
  grid-template-columns:repeat(4, minmax(120px,1fr));
  gap:14px 24px;
  max-width:720px;
  margin-bottom:26px;
}
.footer-links a{
  color:var(--grey-dim);
  text-decoration:none;
  font-size:.85rem;
  transition:color var(--motion-fast) var(--motion-cinema);
}
.footer-links a:hover{ color:#fff; text-decoration:underline; }
.footer-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  font-size:.8rem;
}
@media (max-width:600px){
  .footer-links{ grid-template-columns:repeat(2, minmax(120px,1fr)); }
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

@media (max-width: 820px){
  .navbar{
    padding:12px 18px;
    background:rgba(0,0,0,.86);
    backdrop-filter:blur(14px);
  }

  .nav-left{ gap:12px; }
  .menu-btn{ display:flex; }
  .brand-unit .logo{
    display:block;
    font-size:1.2rem;
  }

  .nav-links{
    position:fixed;
    top:0;
    left:0;
    width:min(82vw, 320px);
    height:100vh;
    padding:88px 24px 24px;
    display:flex;
    flex-direction:column;
    gap:6px;
    background:linear-gradient(180deg, rgba(18,18,18,.98), rgba(9,9,9,.96));
    border-right:1px solid rgba(255,255,255,.12);
    box-shadow:24px 0 55px rgba(0,0,0,.44);
    transform:translateX(-104%);
  transition:transform var(--motion-med) var(--motion-cinema);
  will-change:transform;
    z-index:1100;
  }

  .nav-links span{
    margin:0;
    padding:14px 4px;
    font-size:1.05rem;
    opacity:.92;
  }
  .nav-links span::after{ display:none; }

  body.nav-open .nav-links{
    transform:translateX(0);
  }

  body.nav-open .nav-scrim{
    opacity:1;
    pointer-events:auto;
  }

  .hero{
    min-height:55vh;
    min-height:55dvh;
  }

  .hero-content{
    left:clamp(16px, 4vw, 24px);
    right:clamp(16px, 4vw, 24px);
    top:55%;
    transform:translateY(-55%);
    max-width:none;
  }
  @keyframes heroContentIn{
    from{ opacity:0; transform:translate3d(0,-52%,0); }
    to{ opacity:1; transform:translate3d(0,-60%,0); }
  }

  .hero-title{
    font-size:clamp(1.75rem, 7vw, 2.5rem);
    line-height:1.15;
  }

  .hero-desc{
    font-size:clamp(0.85rem, 2.5vw, 1rem);
    line-height:1.5;
  }

  .btn{
    min-height:44px;
    padding:12px 20px;
    font-size:clamp(0.9rem, 2.5vw, 1rem);
  }

  .section{
    padding:clamp(18px, 3vw, 22px) clamp(14px, 3vw, 18px);
  }

  .footer-links{ max-width:none; }

<script>
  // ---- Presentation-only enhancements. Purely additive: doesn't touch
  // any element that index.js reads from/writes to, and fails silently
  // if something isn't present yet. ----
  (function(){
    // Navbar gains a solid/blurred background once the page scrolls,
    // so it stays legible over any hero image.
    var nav = document.getElementById('navbar');
    if (nav) {
      var onScroll = function(){
        if (window.scrollY > 8) nav.classList.add('scrolled');
        else nav.classList.remove('scrolled');
      };
      window.addEventListener('scroll', onScroll, { passive:true });
      onScroll();
    }

    // Row arrow buttons: purely cosmetic scroll helpers, independent of
    // whatever renders the cards inside each row.
    document.querySelectorAll('.row-arrow').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-scroll-target');
        var row = document.getElementById(id);
        if (!row) return;
        var amount = Math.round(row.clientWidth * 0.85);
        row.scrollBy({ left: btn.classList.contains('prev') ? -amount : amount, behavior:'smooth' });
      });
    });

    var yearEl = document.getElementById('footerYear');
    if (yearEl) yearEl.textContent = new Date().getFullYear();
  })();
</script>
