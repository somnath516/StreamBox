<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#141414">
<title>StreamBox Login</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="128x128" href="/logos/icon-192.png">
<link rel="icon" type="image/png" sizes="256x256" href="/logos/icon-512.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/responsive.css">
<link rel="stylesheet" href="/motion.css">
<script src="/favicon.js?v=2" defer></script>
<script src="/motion.js" defer></script>
<script src="/admin-auth.js"></script>

<style>
:root {
  --red: #E50914;
  --bg: #141414;
  --grey: #b3b3b3;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: #fff;
  font-family: "Segoe UI", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
}

.login-container {
  width: 100%;
  max-width: 420px;
  padding: 40px;
  background: rgba(20, 20, 20, 0.95);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  animation: sbPageEnter 0.92s cubic-bezier(.16, 1, .3, 1) both;
}

@keyframes sbPageEnter {
  from {
    opacity: 0;
    transform: scale(.992);
    filter: saturate(.9);
  }
  to {
    opacity: 1;
    transform: scale(1);
    filter: saturate(1);
  }
}

.login-header {
  text-align: center;
  margin-bottom: 32px;
}

.login-logo {
  height: 48px;
  width: auto;
  margin-bottom: 16px;
  display: inline-block;
}

.login-title {
  font-size: 28px;
  font-weight: 900;
  margin-bottom: 8px;
}

.login-title span:last-child {
  color: var(--red);
}

.login-subtitle {
  color: var(--grey);
  font-size: 14px;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #ddd;
  letter-spacing: 0.05px;
}

input {
  width: 100%;
  padding: 12px 16px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  transition: background 0.26s cubic-bezier(.22, .9, .24, 1),
              border-color 0.26s cubic-bezier(.22, .9, .24, 1),
              box-shadow 0.26s cubic-bezier(.22, .9, .24, 1);
}

input:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(229, 9, 20, 0.6);
  box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.15);
}

input::placeholder {
  color: rgba(255, 255, 255, 0.4);
}

.btn-login {
  width: 100%;
  padding: 12px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.26s cubic-bezier(.22, .9, .24, 1),
              transform 0.26s cubic-bezier(.22, .9, .24, 1),
              box-shadow 0.26s cubic-bezier(.22, .9, .24, 1);
  letter-spacing: 0.05px;
}

.btn-login:hover {
  background: #c40812;
  transform: translate3d(0, -2px, 0);
  box-shadow: 0 8px 24px rgba(229, 9, 20, 0.35);
}

.btn-login:active {
  transform: scale(.98);
}

.btn-login.is-loading {
  opacity: 0.7;
  pointer-events: none;
}

.error-msg {
  background: rgba(229, 9, 20, 0.15);
  border: 1px solid rgba(229, 9, 20, 0.4);
  color: #ff6b6b;
  padding: 12px;
  border-radius: 6px;
  font-size: 13px;
  margin-bottom: 20px;
  display: none;
}

.error-msg.show {
  display: block;
  animation: slideIn 0.36s cubic-bezier(.22, .9, .24, 1) forwards;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translate3d(0, -8px, 0);
  }
  to {
    opacity: 1;
    transform: translate3d(0, 0, 0);
  }
}

.login-footer {
  text-align: center;
  margin-top: 24px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.5);
}

.home-link {
  display: inline-block;
  margin-top: 16px;
  padding: 8px 0;
  color: var(--red);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  transition: opacity 0.26s cubic-bezier(.22, .9, .24, 1);
}

.home-link:hover {
  opacity: 0.8;
}

@media (max-width: 480px) {
  .login-container {
    padding: 28px;
  }
  .login-title {
    font-size: 24px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
  }
}
</style>
</head>

<body>

<div class="login-container">
  <div class="login-header">
    <img class="login-logo" src="/logos/logo master.png" alt="Stream Box">
    <div class="login-title"><span style="color:#fff;">Stream</span><span>Box</span></div>
    <p class="login-subtitle">Admin Portal</p>
  </div>

  <form id="loginForm">
    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
      <label for="adminToken">Admin Token</label>
      <input
        type="password"
        id="adminToken"
        name="adminToken"
        placeholder="Enter admin token"
        autocomplete="current-password"
        required
      >
    </div>

    <button type="submit" class="btn-login" id="submitBtn">Sign In</button>

    <div class="login-footer">
      <p>Secure StreamBox Admin Access</p>
      <a href="/index.html" class="home-link">← Back to Home</a>
    </div>
  </form>
</div>

<script>
(function() {
  const form = document.getElementById('loginForm');
  const tokenInput = document.getElementById('adminToken');
  const submitBtn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');

  // Keep one canonical key, while migrating tokens saved by older admin pages.
  const savedToken = window.StreamBoxAuth.getToken();
  if (savedToken) {
    tokenInput.value = savedToken;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');

    const token = tokenInput.value.trim();
    if (!token) {
      showError('Token cannot be empty');
      return;
    }

    submitBtn.classList.add('is-loading');
    submitBtn.textContent = 'Signing in...';

    try {
      const res = await fetch('/admin', {
        method: 'HEAD',
        headers: {
          'X-Admin-Token': token
        }
      });

      if (res.ok) {
        localStorage.setItem('streambox_admin_token', token);
        const returnTo = new URLSearchParams(window.location.search).get('returnTo');
        window.location.href = returnTo && returnTo.startsWith('/') ? returnTo : '/upload.html';
      } else if (res.status === 401) {
        showError('Invalid admin token');
      } else {
        showError('Authentication failed');
      }
    } catch (err) {
      showError('Connection error: ' + err.message);
    } finally {
      submitBtn.classList.remove('is-loading');
      submitBtn.textContent = 'Sign In';
    }
  });

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('show');
  }

  // Auto-focus token input
  tokenInput.focus();
})();
</script>

</body>
</html>
