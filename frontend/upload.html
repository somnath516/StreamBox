<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, minimum-scale=1.0"/>
<meta name="theme-color" content="#0b0b0b">
<title>Stream Box Admin</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="128x128" href="/logos/icon-192.png">
<link rel="icon" type="image/png" sizes="256x256" href="/logos/icon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/logos/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">

<link rel="stylesheet" href="/motion.css">

<style>
@import url('../netflix-ui.css');

:root {
  --netflix-red: #e50914;
  --bg-main: #0b0b0b;
  --card-bg: rgba(18,18,18,0.9);
  --soft-border: rgba(255,255,255,0.08);
  --admin-ease: cubic-bezier(.16,1,.3,1);
  --admin-fast: 180ms;
  --admin-med: 320ms;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: linear-gradient(to bottom, #0b0b0b, #141414);
  color: white;
  font-family: "Segoe UI", system-ui;
  -webkit-font-smoothing: antialiased;
  text-rendering: geometricPrecision;
  overflow: hidden;
}


.sidebar {
  position: fixed; left: 0; top: 0; width: 280px; height: 100vh; z-index: 1000;
  background: rgba(15,15,15,0.96);
  padding: 30px 24px;
  border-right: 1px solid var(--soft-border);
  transform: translate3d(-101%, 0, 0);
  transition: transform 360ms var(--admin-ease);
  will-change: transform;
  box-shadow: inset -1px 0 0 rgba(255,255,255,0.03), 0 12px 40px rgba(0,0,0,0.35);
}
.sidebar.open {
  transform: translate3d(0, 0, 0);
}

.sidebar h2 {
  color: var(--netflix-red);
  font-weight: 800;
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 32px;
  line-height: 1;
}

.sidebar h2 svg,
.nav-link svg {
  width: 20px;
  height: 20px;
  flex: 0 0 20px;
  shape-rendering: geometricPrecision;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px;
  border-radius: 10px;
  margin-bottom: 8px;
  color: #bbb;
  text-decoration: none;
  min-height: 48px;
  transition: background var(--admin-fast) var(--admin-ease), color var(--admin-fast) var(--admin-ease), transform var(--admin-fast) var(--admin-ease);
  will-change: transform;
}

.nav-link:hover,
.nav-link.active,
.nav-link:focus-visible {
  background: var(--netflix-red);
  color: white;
  outline: none;
}

.nav-link:hover,
.nav-link:focus-visible {
  transform: translate3d(3px, 0, 0);
}

.hamburger {
  position: fixed; left: 20px; top: 20px;
  z-index: 10001;

  background: rgba(20,20,20,0.9);
  border: 1px solid var(--soft-border);
  border-radius: 10px;
  padding: 10px;
  cursor: pointer;
  transition: background var(--admin-fast) var(--admin-ease), transform var(--admin-fast) var(--admin-ease), border-color var(--admin-fast) var(--admin-ease);
  will-change: transform;
}

.hamburger span {
  display: block;
  width: 22px;
  height: 3px;
  background: white;
  margin: 4px 0;
  border-radius: 999px;
  transition: transform 260ms cubic-bezier(0.22, 0.9, 0.24, 1), opacity 180ms ease;
}

.hamburger[aria-expanded="true"] {
  background: rgba(229,9,20,0.16);
  border-color: rgba(229,9,20,0.45);
}

.hamburger[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.hamburger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.nav-scrim {
  position: fixed;
  inset: 0;
  z-index: 900;
  background: rgba(0,0,0,0.48);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--admin-med) var(--admin-ease);
}

.nav-scrim.show {
  opacity: 1;
  pointer-events: auto;
}

.main {
  padding: 90px 40px;
  transition: transform 360ms var(--admin-ease);
  will-change: transform;
}

.main.sidebar-open {
  transform: translate3d(280px, 0, 0);
}

.page-title {
  font-size: clamp(2rem, 4vw, 2.5rem);
  font-weight: 900;
  margin-bottom: 30px;
  letter-spacing: 0;
}

.main-inner {
  max-width: 1080px;
  margin: 0 auto;
}

.upload-card {
  max-width: 1080px;
  margin: auto;
  background: var(--card-bg);
  padding: clamp(26px, 4vw, 40px);
  border-radius: 20px;
  border: 1px solid var(--soft-border);
  box-shadow: 0 22px 70px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.04);
  transition: transform var(--admin-med) var(--admin-ease), border-color var(--admin-med) var(--admin-ease), box-shadow var(--admin-med) var(--admin-ease);
  will-change: transform;
}
.upload-card:hover {
  transform: translate3d(0,-2px,0);
  border-color: rgba(255,255,255,.12);
  box-shadow: 0 28px 82px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.05);
}

.upload-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  align-items: start;
}

.upload-form {
  min-width: 0;
}

.upload-previews {
  position: sticky;
  top: 20px;
  min-width: 0;
  display: none;
  flex-direction: column;
  gap: 20px;
}

.upload-previews.show {
  display: flex;
}

.preview-card {
  background: #141414;
  border: 1px solid var(--soft-border);
  border-radius: 14px;
  overflow: hidden;
}

.preview-card.hidden {
  display: none;
}

.preview-card-title {
  font-size: 0.75rem;
  color: #aaa;
  letter-spacing: .05em;
  text-transform: uppercase;
  padding: 12px 16px;
  border-bottom: 1px solid var(--soft-border);
  background: rgba(255,255,255,0.02);
}

.preview-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 120px;
  color: #666;
  font-size: 0.85rem;
  text-align: center;
  padding: 20px;
}

.preview-card-body {
  padding: 14px;
}

#previewImg,
#heroPreviewImg {
  width: 100%;
  border-radius: 8px;
  display: block;
  object-fit: cover;
}

#previewImg {
  aspect-ratio: 9 / 16;
  width: 100%;
}

#heroPreviewImg {
  aspect-ratio: 16 / 9;
  width: 100%;
}

.form-group {
  margin-bottom: 24px;
}

.form-label {
  font-size: 0.8rem;
  color: #aaa;
  margin-bottom: 8px;
  display: block;
  letter-spacing: .04em;
  text-transform: uppercase;
}

.form-input,
.form-textarea {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid var(--soft-border);
  background: #141414;
  color: white;
  transition: border-color var(--admin-fast) var(--admin-ease), box-shadow var(--admin-fast) var(--admin-ease), background var(--admin-fast) var(--admin-ease), transform var(--admin-fast) var(--admin-ease);
}

.form-input:focus,
.form-textarea:focus {
  border-color: var(--netflix-red);
  outline: none;
  background:#171717;
  box-shadow: 0 0 0 4px rgba(229,9,20,.14);
  transform: translate3d(0,-1px,0);
}

.form-textarea {
  min-height: 100px;
}

.file-btn {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  background: #141414;
  border: 1px dashed #333;
  text-align: center;
  color: #888;
  transition: color var(--admin-fast) var(--admin-ease), border-color var(--admin-fast) var(--admin-ease), background var(--admin-fast) var(--admin-ease), transform var(--admin-fast) var(--admin-ease);
}

.file-btn:hover {
  border-color: var(--netflix-red);
  color: white;
  background: rgba(229,9,20,.08);
  transform: translate3d(0,-1px,0);
}

.file-btn.has-file {
  border: 1px solid var(--netflix-red);
  color: white;
}

.file-info {
  font-size: 0.8rem;
  margin-top: 6px;
  color: #777;
  display: none;
}

.file-info.show {
  display: block;
}

.upload-btn {
  width: 100%;
  padding: 16px;
  margin-top: 25px;
  background: var(--netflix-red);
  border: none;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
  color:#fff;
  box-shadow:0 14px 34px rgba(229,9,20,.24);
  transition: background var(--admin-fast) var(--admin-ease), transform var(--admin-fast) var(--admin-ease), box-shadow var(--admin-fast) var(--admin-ease), opacity var(--admin-fast) var(--admin-ease);
  will-change:transform;
}

.upload-btn:hover {
  background: #ff1e28;
  transform: translate3d(0,-2px,0) scale(1.01);
  box-shadow:0 18px 44px rgba(229,9,20,.34);
}
.upload-btn:active {
  transform: scale(.98);
}
.upload-btn.is-loading,
.upload-btn:disabled {
  opacity: 0.82;
  cursor: wait;
  box-shadow: none;
}

.upload-status-block {
  display: none;
  margin-top: 25px;
  padding: 18px 18px 14px;
  border-radius: 14px;
  background: rgba(0, 0, 0, 0.24);
  border: 1px solid var(--soft-border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}

.upload-status-block.visible {
  display: block;
}

.upload-status-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
  color: #fff;
  font-weight: 700;
  font-size: 0.96rem;
}

.upload-status-header .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--netflix-red);
  box-shadow: 0 0 12px rgba(229,9,20,0.8);
}

.upload-progress-track {
  height: 10px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
  margin-bottom: 10px;
}

.upload-progress-fill {
  height: 100%;
  width: 0%;
  background: var(--netflix-red);
  border-radius: inherit;
  transition: width 0.12s linear;
}

.upload-progress-text {
  margin-bottom: 14px;
  color: #d8d8d8;
  font-size: 0.9rem;
}

.eta-panel {
  display: none;
  padding: 14px 16px;
  border-radius: 12px;
  background: rgba(0,0,0,0.22);
  border: 1px solid var(--soft-border);
}

.eta-panel.visible {
  display: block;
}

.eta-panel-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.eta-panel-row + .eta-panel-row {
  margin-top: 10px;
}

.eta-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #fff;
  font-weight: 700;
}

.eta-value {
  color: var(--netflix-red);
  font-weight: 800;
  letter-spacing: 0.3px;
}

.eta-speed {
  color: #ddd;
  font-size: 0.9rem;
}

.eta-status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #b3b3b3;
  font-size: 0.82rem;
}

.status {
  margin-top: 15px;
  text-align: center;
}

.status.success { color: #46d369; }
.status.error { color: #ff4d4d; }
.status.loading { color: var(--netflix-red); }

@media (max-width: 820px) {
  .main {
    padding: 82px 18px 32px;
  }
  .upload-card {
    border-radius: 16px;
  }
  .main.sidebar-open {
    transform: translate3d(0, 0, 0);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 1ms !important;
    transition-duration: 1ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
</head>

<div class="main" id="main">
  <h1 class="page-title">Upload New Movie</h1>

<div class="upload-card">

      <div class="upload-form">

<script>
// SIDEBAR
const hamburger = document.getElementById('hamburger');
const sidebar = document.getElementById('sidebar');
const main = document.getElementById('main');
const navScrim = document.getElementById('navScrim');

function setSidebar(open) {
  sidebar.classList.toggle('open', open);
  main.classList.toggle('sidebar-open', open);
  navScrim.classList.toggle('show', open);
  hamburger.setAttribute('aria-expanded', open ? 'true' : 'false');
  hamburger.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
}

hamburger.onclick = () => setSidebar(!sidebar.classList.contains('open'));
navScrim.onclick = () => setSidebar(false);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') setSidebar(false);
});

// FILE HANDLING
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const movieFile = document.getElementById('movieFile');
const subtitleFile = document.getElementById('subtitleFile');
const thumbnailFile = document.getElementById('thumbnailFile');
const heroBannerFile = document.getElementById('heroBannerFile'); // NEW
const uploadBtn = document.getElementById('uploadBtn');
const uploadStatusBlock = document.getElementById('uploadStatusBlock');
const status = document.getElementById('status');
const previewImg = document.getElementById('previewImg');
const heroPreviewSection = document.getElementById('heroPreviewSection');
const heroPreviewImg = document.getElementById('heroPreviewImg');
const thumbnailPlaceholder = document.getElementById('thumbnailPlaceholder');
const heroPlaceholder = document.getElementById('heroPlaceholder');
const thumbnailPreviewCard = document.getElementById('thumbnailPreviewCard');
const uploadPreviews = document.querySelector('.upload-previews');

function getAdminToken() {
  let token = localStorage.getItem('streamboxAdminToken') || '';
  if (!token) {
    token = window.prompt('Admin token') || '';
    if (token) localStorage.setItem('streamboxAdminToken', token);
  }
  return token;
}


document.querySelectorAll('.file-input-wrapper').forEach(wrapper => {
  const input = wrapper.querySelector('input');
  const btn = wrapper.querySelector('.file-btn');
  const info = document.getElementById(wrapper.dataset.target + "Info");

  wrapper.onclick = () => input.click();

  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;

    // Client validation
    if (wrapper.dataset.target === "movieFile" && !(/\.(mp4|mkv|webm)$/i.test(file.name) || file.type.startsWith('video/'))) {
      status.innerText = "Movie must be video file";
      status.className = "status error";
      input.value = '';
      return;
    }
    if (wrapper.dataset.target === "subtitleFile" && !file.name.toLowerCase().endsWith('.vtt')) {
      status.innerText = "Subtitle must be .vtt";
      status.className = "status error";
      input.value = '';
      return;
    }

    btn.classList.add('has-file');
    btn.innerText = file.name;
    info.innerText = file.name;
    info.classList.add('show');

if (wrapper.dataset.target === "thumbnailFile") {
      previewImg.src = URL.createObjectURL(file);
      previewImg.style.display = "block";
      if (thumbnailPlaceholder) thumbnailPlaceholder.style.display = "none";
      if (thumbnailPreviewCard) thumbnailPreviewCard.style.display = "block";
      if (uploadPreviews) uploadPreviews.classList.add('show');
    }

    if (wrapper.dataset.target === "heroBannerFile") {
      heroPreviewImg.src = URL.createObjectURL(file);
      heroPreviewImg.style.display = "block";
      if (heroPlaceholder) heroPlaceholder.style.display = "none";
      heroPreviewSection.style.display = "block";
      if (uploadPreviews) uploadPreviews.classList.add('show');
    }
  };
});

// ✅ FIXED UPLOAD HANDLER (with real upload progress)
let uploadInFlight = false;

function setUploadInFlight(v) {
  uploadInFlight = v;
  if (uploadBtn) {
    uploadBtn.disabled = Boolean(v);
    uploadBtn.classList.toggle('is-loading', Boolean(v));
    uploadBtn.style.display = 'block';
  }
  if (uploadStatusBlock) {
    uploadStatusBlock.classList.toggle('visible', Boolean(v));
  }
}

uploadBtn.onclick = async () => {
  if (uploadInFlight) return;
  setUploadInFlight(true);

  const uploadProgressFill = document.getElementById('uploadProgressFill');
  const uploadProgressText = document.getElementById('uploadProgressText');

  if (!movieFile.files?.[0]) {
    status.innerText = 'Select a movie file first';
    status.className = 'status error';
    setUploadInFlight(false);
    return;
  }

  const movie = movieFile.files[0];
  const movieExt = movie.name.toLowerCase().match(/\.[a-z0-9]+$/)?.[0] || '';
  if (!['.mp4', '.mkv', '.webm'].includes(movieExt)) {
    status.innerText = 'Unsupported movie format. Use MP4, MKV, or WebM.';
    status.className = 'status error';
    setUploadInFlight(false);
    return;
  }

  const optionalFiles = [subtitleFile.files?.[0], thumbnailFile.files?.[0], heroBannerFile?.files?.[0]].filter(Boolean);
  const invalidOptional = optionalFiles.find((file) => {
    const ext = file.name.toLowerCase().match(/\.[a-z0-9]+$/)?.[0] || '';
    if (file === subtitleFile.files[0]) return ext !== '.vtt' && ext !== '.srt';
    return !['.jpg', '.jpeg', '.png', '.webp', '.avif'].includes(ext);
  });
  if (invalidOptional) {
    status.innerText = `Unsupported file format: ${invalidOptional.name}`;
    status.className = 'status error';
    setUploadInFlight(false);
    return;
  }

  try {
    const storageResponse = await fetch(`/health/storage?preflight=${Date.now()}`, { cache: 'no-store' });
    const storage = await storageResponse.json();
    const freeBytes = Number(storage.freeSpace);
    const requiredBytes = [movie, ...optionalFiles].reduce((total, file) => total + file.size, 0);
    if (!storageResponse.ok || storage.status !== 'OK' || !Number.isFinite(freeBytes)) {
      throw new Error('Could not check SD-card storage space');
    }
    if (freeBytes <= requiredBytes) {
      const freeGb = (freeBytes / (1024 ** 3)).toFixed(1);
      status.innerText = `Not enough SD-card space. Only ${freeGb} GB is free.`;
      status.className = 'status error';
      setUploadInFlight(false);
      return;
    }
  } catch (err) {
    status.innerText = err.message || 'Could not check SD-card storage space';
    status.className = 'status error';
    setUploadInFlight(false);
    return;
  }

  const formData = new FormData();
  formData.append('title', title.value);
  formData.append('description', desc.value);
  formData.append('movie', movieFile.files[0]);
  if (thumbnailFile.files?.[0]) formData.append('thumbnail', thumbnailFile.files[0]);

  // Optional: Hero Banner (wide image)
  if (heroBannerFile?.files?.[0]) {
    formData.append('heroBanner', heroBannerFile.files[0]);
  }

  if (subtitleFile.files[0]) {
    formData.append('subtitle', subtitleFile.files[0]);
  }

  status.innerText = 'Uploading...';
  status.className = 'status loading';

  if (uploadStatusBlock) uploadStatusBlock.classList.add('visible');
  if (uploadProgressFill) uploadProgressFill.style.width = '0%';
  if (uploadProgressText) uploadProgressText.textContent = 'Uploading... 0%';
  window.StreamBoxMotion?.refresh?.(uploadStatusBlock);

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  const adminToken = getAdminToken();
  if (!adminToken) {
    status.innerText = 'Admin token required';
    status.className = 'status error';
    setUploadInFlight(false);
    if (uploadStatusBlock) uploadStatusBlock.classList.remove('visible');
    return;
  }

  xhr.setRequestHeader('Authorization', `Bearer ${adminToken}`);
  // prevent premature client-side aborts for large uploads
  xhr.timeout = 1000 * 60 * 60; // 1 hour

  // Right-side ETA (minimal; does not touch left progress UI)

  const etaPanel = document.getElementById('etaPanel');
  const etaCountdownEl = document.getElementById('etaCountdown');
  const etaSpeedEl = document.getElementById('etaSpeed');
  const etaStatusEl = document.getElementById('etaStatus');
  const etaStatusTextEl = document.getElementById('etaStatusText');
  const etaStatusIconEl = document.getElementById('etaStatusIcon');


  let uploadStartTs = null;
  // Real-time speed tracking - store recent samples for moving average
  const speedSamples = [];
  const MAX_SPEED_SAMPLES = 10;
  let lastSpeedUpdateTs = null;
  let lastLoadedBytes = 0;

  function formatMMSS(totalSeconds) {
    const seconds = Number.isFinite(totalSeconds) ? totalSeconds : 0;
    const clamped = Math.max(0, Math.floor(seconds));

    const minutes = Math.floor(clamped / 60)
      .toString()
      .padStart(2, '0');

    const secs = Math.floor(clamped % 60)
      .toString()
      .padStart(2, '0');

    return `${minutes}:${secs}`;
  }

  function bytesToMB(b) {
    return b / (1024 * 1024);
  }

  function getRealTimeSpeed() {
    if (speedSamples.length === 0) return 0;
    const sum = speedSamples.reduce((a, b) => a + b, 0);
    return sum / speedSamples.length;
  }

  function setEta(loaded, total) {
    if (!etaPanel) return;
    if (!uploadStartTs) uploadStartTs = Date.now();

    if (etaPanel) {
      etaPanel.style.display = 'block';
      etaPanel.classList.add('visible');
    }

    // XHR progress `total` is unreliable in some environments (or can represent multipart overhead).
    // Disable ETA/speed unless we have a meaningful total.
    if (!Number.isFinite(total) || total <= 0) {
      etaCountdownEl && (etaCountdownEl.textContent = '--:--');
      etaSpeedEl && (etaSpeedEl.textContent = 'Calculating...');
      return;
    }

    const now = Date.now();
    const elapsedSec = (now - uploadStartTs) / 1000;
    const remainingBytes = Math.max(0, total - loaded);

    if (elapsedSec <= 0.05 || loaded <= 0) {
      etaCountdownEl && (etaCountdownEl.textContent = '--:--');
      etaSpeedEl && (etaSpeedEl.textContent = 'Calculating...');
      etaStatusEl && (etaStatusEl.textContent = 'Uploading...');
      if (etaStatusTextEl) etaStatusTextEl.textContent = 'Uploading...';
      if (etaStatusIconEl) etaStatusIconEl.style.opacity = '0.85';
      return;
    }

    // Calculate instantaneous speed since last update (real-time)
    if (lastSpeedUpdateTs !== null && loaded > lastLoadedBytes) {
      const deltaMs = now - lastSpeedUpdateTs;
      if (deltaMs >= 200) { // Sample every 200ms for smoother real-time updates
        const deltaBytes = loaded - lastLoadedBytes;
        const instantSpeed = (deltaBytes / deltaMs) * 1000; // bytes per second
        
        speedSamples.push(instantSpeed);
        if (speedSamples.length > MAX_SPEED_SAMPLES) {
          speedSamples.shift();
        }
      }
    }
    lastSpeedUpdateTs = now;
    lastLoadedBytes = loaded;

    // Use real-time moving average speed
    const speedBytesPerSec = getRealTimeSpeed();
    
    if (!Number.isFinite(speedBytesPerSec) || speedBytesPerSec <= 0) {
      etaCountdownEl && (etaCountdownEl.textContent = '--:--');
      etaSpeedEl && (etaSpeedEl.textContent = 'Calculating...');
      etaStatusEl && (etaStatusEl.textContent = 'Uploading...');
      return;
    }

    const remainingSec = remainingBytes / speedBytesPerSec;
    etaCountdownEl && (etaCountdownEl.textContent = formatMMSS(remainingSec));

    // Real-time speed display
    const mbps = bytesToMB(speedBytesPerSec);
    if (etaSpeedEl) {
      if (mbps >= 1) etaSpeedEl.textContent = `${mbps.toFixed(1)} MB/s`;
      else etaSpeedEl.textContent = `${(speedBytesPerSec / 1024).toFixed(1)} KB/s`;
    }
    if (etaStatusEl) etaStatusEl.textContent = 'Uploading...';
  }

  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) {
      if (uploadProgressText) uploadProgressText.textContent = 'Uploading...';
      return;
    }

    const rawPercent = Math.round((e.loaded / e.total) * 100);
    const percent = Math.min(rawPercent, 99);
    if (uploadProgressFill) uploadProgressFill.style.width = percent + '%';
    if (uploadProgressText) {
      uploadProgressText.textContent = rawPercent >= 100
        ? 'Processing upload...'
        : 'Uploading... ' + percent + '%';
    }

    // ETA updates
    setEta(e.loaded, e.total);
  };

  let finished = false;

function finalize(success, message, extra) {
    if (finished) return;
    finished = true;
    setUploadInFlight(false);

    status.innerText = message;
    status.className = success ? 'status success' : 'status error';
    if (success && uploadProgressFill) uploadProgressFill.style.width = '100%';

    if (etaPanel) {
      if (etaCountdownEl) etaCountdownEl.textContent = success ? '00:00' : '--:--';
      if (etaSpeedEl) etaSpeedEl.textContent = '';
      if (etaStatusIconEl) etaStatusIconEl.style.opacity = '0.95';
      if (etaStatusTextEl) etaStatusTextEl.textContent = success ? 'Upload Complete' : (extra?.failedLabel || 'Upload Failed');
      if (etaStatusEl) etaStatusEl.textContent = '';
    }

    if (uploadStatusBlock) uploadStatusBlock.classList.remove('visible');
    if (uploadBtn) {
      uploadBtn.style.display = 'block';
      uploadBtn.disabled = false;
      uploadBtn.classList.remove('is-loading');
    }
  }

  function safeReleaseWakeLock() {
    try {
      // release is intentionally best-effort; never affect UI outcome
      releaseWakeLock();
    } catch {}
  }

  xhr.onload = () => {
    console.log('🛠 /upload xhr.onload status=', xhr.status);
    console.log('🛠 /upload xhr.onload raw response:', xhr.responseText);

    // parse JSON safely
    let parsed = null;
    try {
      parsed = JSON.parse(xhr.responseText);
      console.log('🛠 /upload parsed JSON:', parsed);
    } catch (e) {
      parsed = null;
      console.log('🛠 /upload parsed JSON = null (invalid JSON)', e?.message || e);
    }

    // IMPORTANT: onload must be the FINAL decision point
    if (finished) return;

    if (xhr.status < 200 || xhr.status >= 300) {
      if (xhr.status === 401) localStorage.removeItem('streamboxAdminToken');
      const msg = parsed?.error
        ? `${parsed.error}${parsed.code ? ` (code: ${parsed.code})` : ''}`
        : (xhr.status === 401
            ? 'Unauthorized. Enter the current admin token and try again.'
            : `Upload failed (server error, HTTP ${xhr.status})`);
      finalize(false, msg, { parsed });
      safeReleaseWakeLock();
      return;
    }

    // 2xx: only treat as success when backend confirms success:true
    if (parsed && parsed.success === true) {
      finalize(true, 'Upload saved to database!', { parsed });
      safeReleaseWakeLock();
      return;
    }

    // 2xx with invalid/missing response fields
    // show a more accurate message to avoid misleading server-error classification
    finalize(false, 'Upload completed but server response invalid', { parsed });
    safeReleaseWakeLock();
  };

  xhr.ontimeout = () => {
    if (finished) return;
    finalize(false, 'Upload timeout. Please try again.');
    safeReleaseWakeLock();
  };

  xhr.onerror = () => {
    if (finished) return;

    const status = xhr.status;
    const responseText = xhr.responseText;

    let parsed = null;
    try {
      parsed = responseText ? JSON.parse(responseText) : null;
    } catch {}

    const msg = (parsed && parsed.error)
      ? parsed.error
      : (status && status !== 0 ? `Upload failed (HTTP ${status})` : 'Upload failed. Check console for details.');

    console.error('[UPLOAD ERROR]', {
      status,
      responseText: typeof responseText === 'string' ? responseText.slice(0, 2000) : responseText,
      parsed,
    });

    finalize(false, msg, { parsed });
    safeReleaseWakeLock();
  };


  // Wake Lock (prevent screen sleep) - graceful fallback
  let wakeLock = null;

  async function enableWakeLock() {
    try {
      if ('wakeLock' in navigator && typeof navigator.wakeLock.request === 'function') {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch (e) {
      console.warn('WakeLock failed:', e?.message || e);
    }
  }
  async function releaseWakeLock() {
    try {
      await wakeLock?.release?.();
    } catch {}
    wakeLock = null;
  }

  // enable only during upload
  enableWakeLock().finally(() => {
    xhr.send(formData);
  });
};


</script>
